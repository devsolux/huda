[package]
name = "huda"
version = "1.0.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Huda: a local, relation-first knowledge space"
default-run = "huda"
autobins = false

[lib]
name = "huda"
path = "src/lib.rs"

[[bin]]
name = "huda"
path = "src/bin/huda.rs"

[[bin]]
name = "huda-desktop"
path = "desktop/main.rs"
required-features = ["desktop"]

[features]
default = ["os-secrets"]
desktop = ["dep:eframe", "dep:auto-launch", "dep:tray-icon", "os-secrets"]
rest = ["dep:httparse", "os-secrets"]
os-secrets = ["dep:keyring"]
code-adapter = ["dep:anyhow", "dep:tree-sitter", "dep:tree-sitter-typescript", "dep:tree-sitter-javascript", "dep:tree-sitter-go", "dep:tree-sitter-python", "dep:tree-sitter-rust", "dep:tree-sitter-java", "dep:tree-sitter-c", "dep:tree-sitter-cpp", "dep:tree-sitter-html", "dep:tree-sitter-css", "dep:tree-sitter-c-sharp", "dep:tree-sitter-kotlin-ng", "dep:tree-sitter-ruby", "dep:tree-sitter-php", "dep:tree-sitter-swift", "dep:tree-sitter-dart-orchard", "dep:tree-sitter-md", "dep:tree-sitter-bash", "dep:tree-sitter-json"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "limits", "fallible_uint"] }
blake3 = "=1.8.7"
sha2 = "=0.11.1"
getrandom = "=0.4.3"
clap = { version = "=4.6.7", features = ["derive"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
libc = "0.2"
schemars = "=1.2.3"
anyhow = { version = "1", optional = true }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
httparse = { version = "=1.10.1", optional = true }
keyring = { version = "=4.2.0", default-features = false, features = ["v1"], optional = true }
tree-sitter = { version = "0.27", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-c-sharp = { version = "0.23.1", optional = true }
tree-sitter-kotlin-ng = { version = "1.1.0", optional = true }
tree-sitter-ruby = { version = "0.23.1", optional = true }
tree-sitter-php = { version = "0.25.1", optional = true }
tree-sitter-swift = { version = "0.7.4", optional = true }
tree-sitter-dart-orchard = { version = "0.7.0", optional = true }
tree-sitter-md = { version = "0.5", optional = true }
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }

# Desktop integrations are optional; the headless Core does not link a GUI.
auto-launch = { version = "=0.6.0", optional = true }
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes",
  "Win32_System_Threading", "Win32_System_Memory", "Win32_UI_Shell"
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.34"

[package.metadata.huda]
product-name = "Huda"
identifier = "com.devsolux.huda"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
